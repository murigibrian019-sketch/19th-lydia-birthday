<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 19th Birthday, Kerubo Lydia!</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="badge">Chapter 19</span>
      <h1>Kerubo Lydia</h1>
    </div>
    <button id="theme-toggle" aria-label="Toggle Theme">Light Mode</button>
  </header>

  <main>
    <section class="hero-cake">
      <p class="instruction" id="cake-hint">Tap the cake to blow out the candles & make a wish!</p>
      
      <div class="cake-container" id="birthday-cake" role="button" tabindex="0" aria-label="Birthday Cake">
        <div class="candles">
          <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
          <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
          <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        </div>
        <div class="cake-top">
          <div class="frosting-drip"></div>
        </div>
        <div class="cake-middle">
          <span class="cake-age">19</span>
        </div>
        <div class="cake-bottom"></div>
        <div class="cake-plate"></div>
      </div>
    </section>

    <section class="form-card">
      <h2>Send a Wish & Memory</h2>
      <form id="wish-form">
        <input type="text" id="sender" placeholder="Your Name" required />
        <textarea id="message" rows="3" placeholder="Write a birthday note for Kerubo Lydia..." required></textarea>
        
        <label class="file-label" for="photo">
          <span id="file-name">Choose a photo from your device (Optional)</span>
          <input type="file" id="photo" accept="image/*" />
        </label>

        <button type="submit" id="submit-btn">Post Wish</button>
      </form>
    </section>

    <section class="feed-section">
      <h2>Birthday Wall</h2>
      <div id="wishes-feed" class="feed-grid"></div>
    </section>
  </main>

  <div id="birthday-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <span class="modal-badge">19 Years of Amazing</span>
      <h2>Happy Birthday, Kerubo Lydia!</h2>
      <p>Wishing you a year filled with joy, growth, laughter, and unforgettable memories.</p>
      <div class="modal-actions">
        <button id="relight-btn" class="secondary-btn">Relight Candles</button>
        <button id="close-modal-btn" class="primary-btn">Celebrate</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
